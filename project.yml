# XcodeGen spec. Generate with `xcodegen generate` (the Makefile does this when the project is missing).
# Kept deliberately plain: it was written without being able to run XcodeGen (Part A, Windows).
name: ChargeGuard

options:
  bundleIdPrefix: com.amir.chargeguard
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc by default; the Makefile passes an Apple Development identity and team when one exists.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES

packages:
  ChargeGuardCore:
    path: Packages/ChargeGuardCore
  ChargeGuardSystem:
    path: Packages/ChargeGuardSystem

targets:
  ChargeGuard:
    type: application
    platform: macOS
    sources:
      - path: ChargeGuard
        excludes:
          - "Resources/Info.plist"
          - "Resources/ChargeGuard.entitlements"
      - path: scripts/install-helper.sh
        buildPhase: resources
      - path: scripts/uninstall.sh
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ChargeGuard
        PRODUCT_BUNDLE_IDENTIFIER: com.amir.chargeguard
        INFOPLIST_FILE: ChargeGuard/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ChargeGuard/Resources/ChargeGuard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: ChargeGuardCore
        product: ChargeGuardCore
      - package: ChargeGuardSystem
        product: ChargeGuardSystem
      - package: ChargeGuardSystem
        product: ChargeGuardSessionKit
      - target: ChargeGuardHelper
        embed: false
      - target: chargectl
        embed: false
    postBuildScripts:
      - name: Embed helper, chargectl and launchd plist
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          CONTENTS="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}"
          mkdir -p "${CONTENTS}/MacOS" "${CONTENTS}/Library/LaunchDaemons"
          ditto "${BUILT_PRODUCTS_DIR}/ChargeGuardHelper" "${CONTENTS}/MacOS/ChargeGuardHelper"
          ditto "${BUILT_PRODUCTS_DIR}/chargectl" "${CONTENTS}/MacOS/chargectl"
          ditto "${SRCROOT}/ChargeGuardHelper/com.amir.chargeguard.helper.plist" "${CONTENTS}/Library/LaunchDaemons/com.amir.chargeguard.helper.plist"

  ChargeGuardHelper:
    type: tool
    platform: macOS
    sources:
      - path: ChargeGuardHelper
        excludes:
          - "*.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: ChargeGuardHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.amir.chargeguard.helper
        INFOPLIST_FILE: ChargeGuardHelper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ChargeGuardHelper/ChargeGuardHelper.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: ChargeGuardCore
        product: ChargeGuardCore
      - package: ChargeGuardSystem
        product: ChargeGuardSystem

  chargectl:
    type: tool
    platform: macOS
    sources:
      - path: chargectl
        excludes:
          - "*.plist"
    settings:
      base:
        PRODUCT_NAME: chargectl
        PRODUCT_BUNDLE_IDENTIFIER: com.amir.chargeguard.chargectl
        INFOPLIST_FILE: chargectl/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    dependencies:
      - package: ChargeGuardCore
        product: ChargeGuardCore
      - package: ChargeGuardSystem
        product: ChargeGuardSystem

schemes:
  ChargeGuard:
    build:
      targets:
        ChargeGuard: all
        ChargeGuardHelper: all
        chargectl: all
    run:
      config: Debug
      commandLineArguments:
        "--simulate": false
    archive:
      config: Release
