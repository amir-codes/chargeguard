# XcodeGen spec. Generate with `xcodegen generate` or `make project` (`make build` does it when the project is missing).
# Kept deliberately plain: it was written without being able to run XcodeGen (Part A, Windows).
# Regenerate after adding or removing source files: XcodeGen lists every file in the project.
name: ChargeGuard

options:
  bundleIdPrefix: com.amir.chargeguard
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_HARDENED_RUNTIME: YES
    # The embed script below writes into the app bundle, outside any declared output.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc by default; the Makefile passes an Apple Development identity and team when one exists.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES

packages:
  ChargeGuardCore:
    path: Packages/ChargeGuardCore
  ChargeGuardSystem:
    path: Packages/ChargeGuardSystem

targets:
  ChargeGuard:
    type: application
    platform: macOS
    sources:
      - path: ChargeGuard
        excludes:
          # Processed through INFOPLIST_FILE / CODE_SIGN_ENTITLEMENTS; never copied as resources.
          - "Resources/Info.plist"
          - "Resources/ChargeGuard.entitlements"
      # Copied to Contents/Resources so the app can show the fallback install / uninstall commands.
      - path: scripts/install-helper.sh
        buildPhase: resources
      - path: scripts/uninstall.sh
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ChargeGuard
        PRODUCT_BUNDLE_IDENTIFIER: com.amir.chargeguard
        INFOPLIST_FILE: ChargeGuard/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ChargeGuard/Resources/ChargeGuard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: ChargeGuardCore
        product: ChargeGuardCore
      - package: ChargeGuardSystem
        product: ChargeGuardSystem
      - package: ChargeGuardSystem
        product: ChargeGuardSessionKit
      # Build-order dependencies only: the tools are copied into Contents/MacOS by the script below.
      - target: ChargeGuardHelper
        embed: false
        link: false
      - target: chargectl
        embed: false
        link: false
    postBuildScripts:
      # Runs after the app's own build phases and before Xcode signs ChargeGuard.app, so the
      # app signature seals the (already signed) tools and the launchd plist.
      - name: Embed helper, chargectl and launchd plist
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/ChargeGuardHelper
          - $(BUILT_PRODUCTS_DIR)/chargectl
          - $(SRCROOT)/ChargeGuardHelper/com.amir.chargeguard.helper.plist
        script: |
          set -euo pipefail
          CONTENTS="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}"
          PLIST_SRC="${SRCROOT}/ChargeGuardHelper/com.amir.chargeguard.helper.plist"
          for tool in ChargeGuardHelper chargectl; do
            if [[ ! -f "${BUILT_PRODUCTS_DIR}/${tool}" ]]; then
              echo "error: ${BUILT_PRODUCTS_DIR}/${tool} is missing (did its target build?)"
              exit 1
            fi
          done
          plutil -lint "${PLIST_SRC}"
          mkdir -p "${CONTENTS}/MacOS" "${CONTENTS}/Library/LaunchDaemons"
          ditto "${BUILT_PRODUCTS_DIR}/ChargeGuardHelper" "${CONTENTS}/MacOS/ChargeGuardHelper"
          ditto "${BUILT_PRODUCTS_DIR}/chargectl" "${CONTENTS}/MacOS/chargectl"
          ditto "${PLIST_SRC}" "${CONTENTS}/Library/LaunchDaemons/com.amir.chargeguard.helper.plist"

  ChargeGuardHelper:
    type: tool
    platform: macOS
    sources:
      - path: ChargeGuardHelper
        excludes:
          # Info.plist is embedded with CREATE_INFOPLIST_SECTION_IN_BINARY; the launchd plist is
          # copied into the app by the app target's script. A tool has no resources phase.
          - "*.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: ChargeGuardHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.amir.chargeguard.helper
        INFOPLIST_FILE: ChargeGuardHelper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ChargeGuardHelper/ChargeGuardHelper.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: ChargeGuardCore
        product: ChargeGuardCore
      - package: ChargeGuardSystem
        product: ChargeGuardSystem

  chargectl:
    type: tool
    platform: macOS
    sources:
      - path: chargectl
        excludes:
          - "*.plist"
    settings:
      base:
        PRODUCT_NAME: chargectl
        PRODUCT_BUNDLE_IDENTIFIER: com.amir.chargeguard.chargectl
        INFOPLIST_FILE: chargectl/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    dependencies:
      - package: ChargeGuardCore
        product: ChargeGuardCore
      - package: ChargeGuardSystem
        product: ChargeGuardSystem

schemes:
  ChargeGuard:
    build:
      targets:
        ChargeGuard: all
        ChargeGuardHelper: all
        chargectl: all
    run:
      config: Debug
      executable: ChargeGuard
      commandLineArguments:
        "--simulate": false
    archive:
      config: Release
